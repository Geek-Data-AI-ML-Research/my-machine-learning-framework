name: saas-anti-drift

on:
  push:
    paths:
      - "src/mymlfw/api/**"
      - "src/mymlfw/mcp/**"
      - "src/mymlfw/saas/**"
      - "contracts/**"
      - "scripts/check_saas_anti_drift.py"
      - "scripts/generate_openapi.py"
  pull_request:
    paths:
      - "src/mymlfw/api/**"
      - "src/mymlfw/mcp/**"
      - "src/mymlfw/saas/**"
      - "contracts/**"
      - "scripts/**"

jobs:
  anti-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install saas + dev extras
        run: pip install -e ".[saas,dev]"
      - name: AST / OpenAPI anti-drift
        run: python scripts/check_saas_anti_drift.py
      - name: SaaS unit tests
        run: python -m pytest -q tests/test_saas_wave1.py
