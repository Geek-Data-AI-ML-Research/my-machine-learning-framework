[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mymlfw"
version = "0.1.0"
description = "Campaign, blend, and submission toolkit for ML and Kaggle work."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "pyarrow",
  "scipy",
  "pyyaml",
]

[project.optional-dependencies]
train = ["torch", "transformers", "peft", "safetensors"]
saas = [
  "pymongo[zstd]>=4.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "redis>=5.2",
  "python-ulid>=3.0",
  "passlib[argon2]>=1.7.4",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "mcp>=1.0,<3",
]
dev = ["pytest", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.27"]
all = ["mymlfw[train,saas,dev]"]

[project.scripts]
mymlfw = "mymlfw.__main__:main"
mymlfw-api = "mymlfw.api.app:main"
mymlfw-mcp = "mymlfw.mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mymlfw = ["resources/llms.txt", "resources/recipes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
